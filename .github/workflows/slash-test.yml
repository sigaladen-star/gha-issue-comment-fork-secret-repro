name: Slash Test Repro

on:
  issue_comment:
    types: [created]

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for /test
        id: check
        run: |
          if [[ "${{ github.event.comment.body }}" == "/test" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  run-test:
    needs: parse
    if: needs.parse.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.issue.pull_request.head.repo.full_name }}
          ref: ${{ github.event.issue.pull_request.head.ref }}

      - name: Run probe script
        run: bash probe.sh
        env:
          CANARY_SECRET: ${{ secrets.CANARY_SECRET }}
